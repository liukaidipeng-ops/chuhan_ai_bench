# AI 增强实验：新电脑对线上电脑的分段对打（用户 2026-10-17 同意在本公开仓库用 GitHub 免费机器跑）。
# 只在分支 claude/chuhan-xiangqi-chat-x9kpy8 上、推送了 lab/jobs/ 下的请求文件时才跑；结果由机器人提交到 lab/results/。
name: AI 对打（lab）
on:
  push:
    branches: [claude/chuhan-xiangqi-chat-x9kpy8]
    paths: ['lab/jobs/**']
permissions:
  contents: write
concurrency:
  group: lab-match
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      any: ${{ steps.p.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: p
        run: node lab/tools/ci_match.js plan "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    name: ${{ matrix.name }} 第 ${{ matrix.chunk }} 段
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node lab/tools/ci_match.js run "${{ matrix.req }}" "${{ matrix.chunk }}"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.name }}-${{ matrix.chunk }}
          path: out/
          retention-days: 7
  collect:
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - run: node lab/tools/ci_match.js collect parts
      - name: 把结果提交回分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lab/results   # 仓库的 .gitignore 忽略 results/，这里强制加
          git diff --cached --quiet && exit 0
          git commit -q -m "对打结果：$(ls parts | sed -E 's/-[0-9]+\.json$//' | sort -u | tr '\n' ' ')（运行 ${{ github.run_id }}）"
          for i in 1 2 3 4 5; do git pull --rebase -q origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}" && exit 0; sleep $((i * 5)); done
          exit 1
